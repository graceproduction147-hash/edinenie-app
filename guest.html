<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="theme-color" content="#0A0D1A">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Открытый эфир · Единение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0A0D1A;--fg:#F1E9DF;--muted:#9C97A6;--line:rgba(241,233,223,.13);--accent:#DCA67E;--accent-soft:rgba(220,166,126,.13);--wine:#3B1A25;--surface:rgba(255,255,255,.04);
--display:"Forum",Georgia,serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100vh;font-size:15px;line-height:1.55;overflow-x:hidden}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 100% 0%,rgba(59,26,37,.85),transparent 70%),radial-gradient(55% 40% at 0% 100%,rgba(60,78,140,.28),transparent 70%)}
main{position:relative;max-width:520px;margin:0 auto;padding:28px 18px 60px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin-top:6px;text-wrap:balance}
.by{color:var(--muted);margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.card h2{font-family:var(--display);font-weight:400;font-size:21px;margin-bottom:6px}
.muted{color:var(--muted)}
ul.pts{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:10px}
ul.pts li{padding-left:18px;position:relative}
ul.pts li::before{content:"";position:absolute;left:0;top:.65em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:14px 22px;font-weight:700;font-size:15px;background:var(--accent);color:#1b1118;width:100%;text-align:center;text-decoration:none;display:block}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip{border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;background:none;color:var(--fg);width:auto;font-weight:500}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.q{font-weight:600;margin-top:12px}
.route{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.it{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px}
.it .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);min-width:64px}
.it .t{flex:1}.it small{display:block;color:var(--muted)}
.lock{opacity:.6}
.offer{background:linear-gradient(160deg,rgba(59,26,37,.9),rgba(26,32,64,.9));border-color:rgba(220,166,126,.4)}
.offer p{white-space:pre-wrap;margin-bottom:14px}
.err{color:#E39595;text-align:center;padding:40px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="glow"></div>
<main id="app"><div class="muted" style="text-align:center;padding:60px 0">Загружаем…</div></main>
<script>
const TG=window.Telegram&&Telegram.WebApp;try{TG&&TG.ready();TG&&TG.expand()}catch(e){}
const P=new URLSearchParams(location.search),F=P.get("f")||"",GO=P.get("go")||"";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bold=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
async function api(path,body){const h={"X-Init-Data":(TG&&TG.initData)||"","Content-Type":"application/json"};
  const dev=P.get("dev");if(dev)h["X-Dev-User"]=dev;
  const r=await fetch(path,{method:body?"POST":"GET",headers:h,body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>null);if(!r.ok)throw new Error((d&&d.detail)||"Не получилось, попробуйте еще раз");return d}
function openLink(u){try{if(TG&&TG.openLink){TG.openLink(u);return}}catch(e){}window.open(u,"_blank")}
let D=null,pick={focus:"",want:""};
function routeHtml(r){return `<div class="route">${r.map(x=>`<div class="it"><span class="k">${esc(x.kind)}</span><span class="t">${esc(x.title)}${x.sub?`<small>${esc(x.sub)}</small>`:""}</span><span class="lock muted">в клубе</span></div>`).join("")}</div>
<p class="muted" style="margin-top:12px">Все это откроется, когда вы станете участником клуба.</p>`}
function draw(){const e=D.event;
  let h=`<div><div class="eyebrow">Открытый эфир клуба</div><h1>${esc(e?e.title:D.title)}</h1>${e&&e.speaker?`<div class="by">${esc(e.speaker)}</div>`:""}</div>`;
  if(e&&(e.description||(e.summary&&e.summary.length)))h+=`<div class="card">${e.description?`<p>${esc(e.description)}</p>`:""}${e.summary&&e.summary.length?`<ul class="pts">${e.summary.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>`;
  h+=e&&e.can_watch?`<button id="watch">${D.watched?"Смотреть еще раз":"Смотреть эфир"}</button>`:`<div class="card muted">Запись скоро появится, бот напишет вам.</div>`;
  h+=`<div class="card" id="aCard"><h2>Персональный маршрут</h2>`;
  if(D.route)h+=`<p class="muted">Подобрали то, что стоит посмотреть в клубе именно вам.</p>${routeHtml(D.route)}`;
  else h+=`<p class="muted">Если хотите, ответьте на два коротких вопроса, и мы покажем, какие эфиры и материалы клуба подойдут вам. Это займет полминуты.</p>
<div class="q">Что сейчас для вас важнее всего?</div><div class="chips" id="cf">${D.focus.map(x=>`<button class="chip" data-v="${x[0]}">${esc(x[1])}</button>`).join("")}</div>
<div class="q">Чего хочется больше?</div><div class="chips" id="cw">${D.want.map(x=>`<button class="chip" data-v="${x[0]}">${esc(x[1])}</button>`).join("")}</div>
<button id="go" disabled>Собрать маршрут</button>`;
  h+=`</div>`;
  if((D.watched||D.route)&&D.offer&&!D.member)h+=`<div class="card offer" id="offer"><p>${bold(D.offer)}</p><button id="join">${esc(D.offer_btn)}</button></div>`;
  $("#app").innerHTML=h;
  const w=$("#watch");if(w)w.onclick=async()=>{w.disabled=true;try{const r=await api("/api/guest/watch",{f:F});D.watched=true;openLink(r.url);draw();setTimeout(()=>{const o=$("#offer");o&&o.scrollIntoView({behavior:"smooth"})},400)}catch(x){alert(x.message);w.disabled=false}};
  const j=$("#join");if(j)j.onclick=()=>openLink(D.join);
  const upd=()=>{const g=$("#go");if(g)g.disabled=!pick.focus};
  [["#cf","focus"],["#cw","want"]].forEach(([s,k])=>{const c=$(s);if(!c)return;c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{pick[k]=b.dataset.v;c.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));upd()})});
  const g=$("#go");if(g)g.onclick=async()=>{g.disabled=true;try{const r=await api("/api/guest/anketa",{f:F,focus:pick.focus,want:pick.want});D.route=r.route;draw();$("#aCard").scrollIntoView({behavior:"smooth"})}catch(x){alert(x.message);g.disabled=false}};
  if(GO==="anketa"&&!D._sc){D._sc=1;setTimeout(()=>{const a=$("#aCard");a&&a.scrollIntoView()},200)}}
(async()=>{try{D=await api("/api/guest/funnel?f="+encodeURIComponent(F));draw()}catch(e){$("#app").innerHTML=`<div class="err">${esc(e.message)}</div>`}})();
</script>
</body>
</html>
